name: Deploy Birthday Invitation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cấp quyền cho GITHUB_TOKEN để deploy lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Giới hạn 1 lượt deploy tại 1 thời điểm để tránh conflict
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cài đặt thư viện phụ thuộc
        run: npm ci

      - name: Build ứng dụng web
        run: npm run build

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Tải lên artifact thư mục dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
